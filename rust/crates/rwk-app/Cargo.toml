[package]
name = "rwk-app"
description = "RWK Router Keyer desktop app (Tauri v2): the operator UI over the native rwk-core engine."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The Client (operating-position) binary.
[[bin]]
name = "w1ve-rkr"
path = "src/main.rs"

# The Station (remote radio site) binary. A separate executable sharing this crate's library
# and web bundle, but running the Station controller, command set, and window.
[[bin]]
name = "w1ve-rkr-station"
path = "src/main_station.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rwk-core = { path = "../rwk-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Direct serial access for the Station's logger (WinKeyer) input, which must *read* bytes —
# rwk-core's serial layer is keying-output only (control lines, no data bytes).
serialport = { workspace = true }

# Windows device-change notifications (WM_DEVICECHANGE) for instant serial PnP detection. We
# subclass Tauri's own window; off Windows the watcher falls back to timer polling and this
# dependency is not compiled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
] }

[features]
# Enabled by Tauri's build tooling for production bundles; harmless in dev.
custom-protocol = ["tauri/custom-protocol"]
